addEventListener("touchstart", e => { sOk = !e.target.closest(".vw,input"); sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
addEventListener("touchend", e => { if (!sOk) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) dx < 0 ? next() : prev(); }, { passive: true });

/* ===================== ИНТЕРАКТИВ ===================== */
// Слайд 3: шаги создания ГМО (спираль → вырезание гена → кольцо-плазмида → клетка)
const STEPS = [{ hl: 1 }, { hl: 1, lift: 1 }, { hl: 1, lift: 0, m: 1, vec: 1 }, { hl: 1, lift: 0, m: 1, vec: 1, fx: .82, s: .6 }];
let gi = 0;
function gsReset() { gi = 0; const c = $("#gc"); if (c) { c.hidden = true; $("#gs").textContent = D.ui.step; } }
$("#gs").onclick = () => { const c = $("#gc"); c.hidden = false; c.textContent = `${gi + 1}/4. ${D.s3.steps[gi]}`; aim({ ...P[2], ...STEPS[gi] }, FULL); gi = (gi + 1) % 4; $("#gs").textContent = gi ? D.ui.next : D.ui.again; };
$("#gr").onclick = () => { gsReset(); aim(P[2], FULL); };
// Слайд 10: тест
(function quiz() {
  const root = $("#qz"); let i = 0, score = 0, Q;
  const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
  function start() { i = 0; score = 0; Q = shuffle(D.quiz.map(x => ({ ...x }))); draw(); }
  function draw() {
    if (i >= Q.length) { root.innerHTML = `<p class="cd"><strong>${D.qui.score} ${score} / ${Q.length}</strong></p><button class="b" id="qr">${D.ui.again}</button>`; $("#qr").onclick = start; return; }
    const x = Q[i], opts = shuffle([{ t: x.a, ok: 1 }, ...x.w.map(t => ({ t, ok: 0 }))]);
    root.innerHTML = `<p class="mut">${D.qui.of} ${i + 1}/${Q.length}</p><p><strong>${x.q}</strong></p>${opts.map((o, k) => `<button class="b opt" data-k="${k}">${o.t}</button>`).join("")}<p id="qe" aria-live="polite"></p><button class="b" id="qn" hidden>${D.ui.next}</button>`;
    $$(".opt", root).forEach(b => b.onclick = () => {
      const o = opts[+b.dataset.k]; if (o.ok) score++;
      $$(".opt", root).forEach((c, k) => { c.disabled = true; if (opts[k].ok) c.classList.add("ok"); else if (c === b) c.classList.add("no"); });
      $("#qe").textContent = (o.ok ? D.qui.correct : D.qui.wrong) + x.e; $("#qn").hidden = false; $("#qn").focus();
    });
    $("#qn").onclick = () => { i++; draw(); };
  }
  start();
})();

/* ===================== ЦИКЛ АНИМАЦИИ ===================== */
function loop(now) {
  requestAnimationFrame(loop);
  const dtt = Math.min(.1, (now - (loop.l || now)) / 1000); loop.l = now;
  if (playing) { setG(Math.min(1, pv + dtt / 9)); if (pv >= 1) playing = false; }   // рост за 9 секунд
  const k = ease(Math.min(1, (now - t0) / dur)); keys.forEach(x => cur[x] = from[x] + (to[x] - from[x]) * k);
  upd(cur, now / 1000); R.render(sc, cam);
  if (idx === 5) PL.draw(now / 1000); else if (idx === 6) BA.draw(now / 1000); else if (idx === 3) PS.draw(now / 1000);
}
const m = /slide-(\d+)/.exec(location.hash), start0 = m ? Math.min(N_SL, Math.max(1, +m[1])) - 1 : 0;
cur = { ...P[start0] }; show(start0, true); requestAnimationFrame(loop);
})();
